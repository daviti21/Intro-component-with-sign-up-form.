 <!DOCTYPE html>
 <html lang="en">
 <head>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
   
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intro component with sign-up form</title>
    <link rel="stylesheet" href="styles.css">
<link
  href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet"/>

</head>
 <body>
    <div class="container">
        <div class="left">
            <h1>Learn to code by watching others</h1>
            <p class="txt">See how experienced developers solve problems in real-time. Watching scripted tutorials is great, but understanding how developers think is invaluable.</p>
        </div>
        <div class="right">
            <div class="price">
                <p class="pricetxt"><span class=bold>Try it free 7 days</span>then $20/mo. thereafter</p>
            </div>
            <div class="formbox">
                <form id="signup">
                    <div class="formgrop">
                        <div class="inputbox">
                            <input type="text" id="name" name="name" placeholder="First Name">
                             
                        </div>
                         
                    </div>
                     <div class="formgrop">
                        <div class="inputbox">
                            <input type="text" id="lsname" name="lsname" placeholder="Last Name">
                            
                        </div>
                 
                    </div>
                     <div class="formgrop">
                        <div class="inputbox">
                            <input type="email" id="email" name="email" placeholder="Email Address">
                            
                        </div>
                        
                    </div>
                     <div class="formgrop">
                        <div class="inputbox">
                            <input type="password" id="password" name="password" placeholder="Password">
                            
                        </div>
                         
                    </div>
                    <button id="btn" type="submit">CLAIM YOUR FREE TRIAL</button>
                </form>
                 <p class="foot">By clicking the button, you are agreeing to our <span class="red">Terms and Services</span></
            </div>
        </div>
    </div>
    <script src="app.js"></script>
 </body>
 </html>
